<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anna Daatha - Share Food, Spread Love</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#fef9f3;color:#333}
header{background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 20px #0001}
.logo{font-weight:700;font-size:22px;color:#ff6b00} .logo span{color:#333}
.btn-primary{background:linear-gradient(135deg,#ff6b00,#ff8533);color:white;border:0;padding:10px 18px;border-radius:25px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px #ff6b0040}
.hero{text-align:center;padding:30px 20px;background:linear-gradient(135deg,#fff7e6,#ffe8cc)}
.hero h1{font-size:28px;line-height:1.2} .hero h1 span{color:#ff6b00}
.hero p{color:#666;margin:12px 0 20px}
.search-bar{max-width:600px;margin:0 auto;display:flex;gap:8px;background:white;padding:8px;border-radius:30px;box-shadow:0 8px 25px #0001}
.search-bar input{flex:1;border:0;padding:10px 15px;outline:none;border-radius:20px}
.filters{max-width:800px;margin:20px auto;display:flex;gap:10px;overflow:auto;padding:0 15px}
.filter{padding:6px 16px;border-radius:20px;border:1px solid #ffdab3;background:white;cursor:pointer;white-space:nowrap}
.filter.active{background:#ff6b00;color:white;border-color:#ff6b00}
.container{max-width:1100px;margin:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px #0001;transition:.3s}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 30px #0002}
.card-img{height:180px;background-size:cover;background-position:center;position:relative}
.badge{position:absolute;top:12px;left:12px;background:white;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.card-body{padding:14px}
.card-body h3{font-size:16px;margin-bottom:4px}
.meta{font-size:13px;color:#777;display:flex;gap:10px;margin:6px 0}
.card-actions{display:flex;gap:8px;margin-top:10px}
.btn-claim{flex:1;background:#00b15a;color:white;border:0;padding:10px;border-radius:10px;font-weight:600;cursor:pointer}
.btn-del{background:#f1f1f1;border:0;padding:10px;border-radius:10px;cursor:pointer}
.empty{text-align:center;grid-column:1/-1;padding:50px;color:#999}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:99;padding:15px}
.modal.show{display:flex}
.modal-box{background:white;width:100%;max-width:440px;border-radius:20px;padding:22px;animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h2{margin-bottom:12px}
.modal-box input,.modal-box select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;outline:none}
.modal-box input:focus{border-color:#ff6b00}
.row{display:flex;gap:10px}
.row>*{flex:1}
.close{float:right;font-size:22px;cursor:pointer}
.count{max-width:1100px;margin:10px auto 0;padding:0 20px;color:#666}
</style>
</head>
<body>

<header>
  <div class="logo">🍱 Anna <span>Daatha</span></div>
  <button class="btn-primary" onclick="openM()">+ Share Food</button>
</header>

<div class="hero">
  <h1>Share Food, <span>Spread Love</span> ❤️</h1>
  <p>Excess food ni waste cheyaku - need unna vallaki share cheyi</p>
  <div class="search-bar">
    <input id="search" placeholder="Search dish, location..." oninput="render()">
    <button class="btn-primary" onclick="render()">Search</button>
  </div>
</div>

<div class="filters">
  <div class="filter active" onclick="setFilter('All',this)">All</div>
  <div class="filter" onclick="setFilter('Veg',this)">🥗 Veg</div>
  <div class="filter" onclick="setFilter('Non-Veg',this)">🍗 Non-Veg</div>
  <div class="filter" onclick="setFilter('Sweets',this)">🍰 Sweets</div>
  <div class="filter" onclick="setFilter('Tiffin',this)">☕ Tiffin</div>
</div>

<div class="count">Available: <b id="cnt">0</b> foods • Badvel & around</div>
<div class="container" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <span class="close" onclick="closeM()">×</span>
    <h2>🍛 Share Your Food</h2>
    <input id="fName" placeholder="Dish Name * (ex: Pulihora, Biryani)">
    <div class="row">
      <select id="fCat"><option>Veg</option><option>Non-Veg</option><option>Sweets</option><option>Tiffin</option></select>
      <input id="fQty" placeholder="Qty * (ex: 2 plates)">
    </div>
    <input id="fLoc" placeholder="Location * (ex: Badvel, RTC Bustand)">
    <input id="fPhone" placeholder="Phone * (ex: 98765...)">
    <input id="fImg" placeholder="Image URL (optional) - lekapothe auto image vastundi">
    <p id="err" style="color:red;font-size:13px;text-align:center"></p>
    <button class="btn-primary" style="width:100%;margin-top:10px;padding:13px" onclick="addFood()">Share Now - Unlimited ♾️</button>
  </div>
</div>

<script>
let foods = JSON.parse(localStorage.getItem('anna_foods') || '[]');
if(foods.length==0){
 foods=[
  {id:1,name:"Veg Biryani",cat:"Veg",qty:"3 plates",loc:"Badvel Main Road",phone:"9876543210",img:"https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=500",time:"10:30 AM"},
  {id:2,name:"Pulihora + Curd Rice",cat:"Veg",qty:"2 boxes",loc:"Badvel Temple",phone:"9123456789",img:"https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=500",time:"9:15 AM"}
 ];
}
let curFilter='All';
function openM(){document.getElementById('modal').classList.add('show')}
function closeM(){document.getElementById('modal').classList.remove('show');document.getElementById('err').innerText=''}
function setFilter(f,el){curFilter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function addFood(){
 let n=document.getElementById('fName').value.trim();
 let c=document.getElementById('fCat').value;
 let q=document.getElementById('fQty').value.trim();
 let l=document.getElementById('fLoc').value.trim();
 let p=document.getElementById('fPhone').value.trim();
 let img=document.getElementById('fImg').value.trim();
 if(!n||!q||!l||!p){document.getElementById('err').innerText='Dish, Qty, Location, Phone required!';return;}
 let defaultImg = c=='Non-Veg'?'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=500':c=='Sweets'?'https://images.unsplash.com/photo-1551024506-0bccd828d307?w=500':'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=500';
 foods.unshift({id:Date.now(),name:n,cat:c,qty:q,loc:l,phone:p,img:img||defaultImg,time:new Date().toLocaleTimeString()});
 localStorage.setItem('anna_foods',JSON.stringify(foods));
 document.getElementById('fName').value='';document.getElementById('fQty').value='';document.getElementById('fLoc').value='';document.getElementById('fPhone').value='';document.getElementById('fImg').value='';
 closeM();render();
}
function claim(id){
 if(confirm('Ee food ni claim cheyala? Owner ki call chestava?')){
  foods=foods.filter(f=>f.id!==id);
  localStorage.setItem('anna_foods',JSON.stringify(foods));
  render();
 }
}
function render(){
 let s=document.getElementById('search').value.toLowerCase();
 let filtered=foods.filter(f=>{
  let matchFilter=curFilter=='All'||f.cat==curFilter;
  let matchSearch=f.name.toLowerCase().includes(s)||f.loc.toLowerCase().includes(s);
  return matchFilter&&matchSearch;
 });
 document.getElementById('cnt').innerText=filtered.length;
 let h='';
 if(filtered.length==0){h='<div class="empty">😔 No foods found<br>Be first to share!</div>'}
 else{
  filtered.forEach(f=>{
   h+=`<div class="card"><div class="card-img" style="background-image:url('${f.img}')"><div class="badge">${f.cat}</div></div><div class="card-body"><h3>${f.name}</h3><div class="meta"><span>📍 ${f.loc}</span><span>• ${f.qty}</span></div><div class="meta"><span>🕒 ${f.time}</span><span>📞 ${f.phone}</span></div><div class="card-actions"><button class="btn-claim" onclick="window.open('tel:${f.phone}');claim(${f.id})">Claim & Call</button><button class="btn-del" onclick="claim(${f.id})">✓</button></div></div></div>`;
  });
 }
 document.getElementById('list').innerHTML=h;
}
render();
window.onclick=e=>{if(e.target.id=='modal')closeM()}
</script>
</body>
</html>
